#============================================================================
# Global & Defaults Config
#============================================================================
global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon

    # Turn on management stats socket
    stats socket /var/lib/haproxy/stats

    # Utilize system crypto policy
    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-server-ciphers PROFILE=SYSTEM

defaults
    mode                    tcp
    log                     global
    retries                 3
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout check           10s
    maxconn                 3000

#============================================================================
# Optional: HAProxy Web Stats Dashboard
# Accessible over your external network at http://172.31.100
#============================================================================
listen stats
    bind 172.31.100.46:9000
    mode http
    stats enable
    stats uri /metrics
    stats refresh 10s

#============================================================================
# Kubernetes API Server (Port 6443)
# Handles cluster management. Accessible externally and internally.
#============================================================================
frontend okd-api
    bind 10.31.100.46:6443
    bind 172.31.100.46:6443
    mode tcp
    option tcplog
    default_backend okd-api-backend

backend okd-api-backend
    mode tcp
    balance roundrobin
    option ssl-hello-chk
    # NOTE: Comment out the bootstrap node after installation is complete
    server bootstrap 10.31.100.10:6443 check
    server ctl1      10.31.100.11:6443 check
    server ctl2      10.31.100.12:6443 check
    server ctl3      10.31.100.13:6443 check

#============================================================================
# Machine Config Server (Port 22623)
# Only accessed internally by nodes during deployment/scaling.
#============================================================================
frontend okd-machine-config
    bind 10.31.100.46:22623
    mode tcp
    option tcplog
    default_backend okd-machine-config-backend

backend okd-machine-config-backend
    mode tcp
    balance roundrobin
    option ssl-hello-chk
    # NOTE: Comment out the bootstrap node after installation is complete
    server bootstrap 10.31.100.10:22623 check
    server ctl1      10.31.100.11:22623 check
    server ctl2      10.31.100.12:22623 check
    server ctl3      10.31.100.13:22623 check

#============================================================================
# OKD Ingress - HTTP (Port 80)
# Routes application wildcard (*.apps.okd.example.com) web traffic.
#============================================================================
frontend okd-ingress-http
    bind 172.31.100.46:80
    bind 10.31.100.46:80
    mode tcp
    option tcplog
    default_backend okd-ingress-http-backend

backend okd-ingress-http-backend
    mode tcp
    balance roundrobin
    server wk1 10.31.100.14:80 check
    server wk2 10.31.100.15:80 check
    server wk3 10.31.100.16:80 check

#============================================================================
# OKD Ingress - HTTPS (Port 443)
# Routes secure application wildcard traffic and the OKD Web Console.
#============================================================================
frontend okd-ingress-https
    bind 172.31.100.46:443
    bind 10.31.100.46:443
    mode tcp
    option tcplog
    default_backend okd-ingress-https-backend

backend okd-ingress-https-backend
    mode tcp
    balance roundrobin
    server wk1 10.31.100.14:443 check
    server wk2 10.31.100.15:443 check
    server wk3 10.31.100.16:443 check

