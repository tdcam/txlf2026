apiVersion: v1
kind: PersistentVolume
metadata:
  name: image-registry-nfs-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.31.100.46
    path: /var/export/registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-registry-claim
  namespace: openshift-image-registry
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: image-registry-nfs-pv

